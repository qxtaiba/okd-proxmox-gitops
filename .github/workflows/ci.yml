---
name: ci
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      # Pinned: an unpinned @latest let yamlfmt 0.21.0 change formatting
      # rules under us and silently redden CI for a month. Renovate bumps
      # the pin via the annotated-dependency manager; any reformat rides
      # the same PR.
      - run: |
          # renovate: datasource=go depName=github.com/google/yamlfmt
          YAMLFMT_VERSION=v0.21.0
          go install "github.com/google/yamlfmt/cmd/yamlfmt@${YAMLFMT_VERSION}"
      - run: yamlfmt -lint .
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: |
          # renovate: datasource=go depName=github.com/yannh/kubeconform
          KUBECONFORM_VERSION=v0.8.0
          go install "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"
      - run: |
          kubeconform -summary -strict \
            -ignore-filename-pattern '.*/(kustomization|secret)\.yaml' \
            -ignore-filename-pattern '.*/homepage/app/resources/.*' \
            -schema-location default \
            -schema-location 'https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -skip CustomResourceDefinition,MachineConfig,Terraform,FluxInstance,Route,SecurityContextConstraints,APIServer,Config,DNS,IngressController,IPAddressPool,L2Advertisement \
            kubernetes/
  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_wrapper: false
      - run: |
          for module in prowlarr sonarr radarr; do
            tofu -chdir=kubernetes/terraform/$module fmt -check -diff
            tofu -chdir=kubernetes/terraform/$module init -backend=false
            tofu -chdir=kubernetes/terraform/$module validate
          done
  validate-flux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: fluxcd/flux2/action@03af120af1b9c97dba1c94ca251ece481b352bfb # main
      - run: pip install flux-local
      - run: flux-local test --path kubernetes/clusters/production --enable-helm --all-namespaces
  # Every *.bu must render byte-identically to its committed machineconfig.yaml.
  # Renovate bumps image tags inside .bu sources (see customManagers) but cannot
  # regenerate the rendered MachineConfig; this gate turns a bumped-but-stale
  # render into a loud failure instead of a silently ineffective merge.
  # Regenerate with: { echo "---"; butane --strict <file>.bu; } > machineconfig.yaml
  # Renders every *.bu and, on a same-repo PR, COMMITS the result rather than
  # merely failing. The rendered MachineConfig embeds its files as gzip+base64,
  # so the image tag inside is not greppable and renovate cannot refresh it --
  # it edits the .bu and leaves the render stale every single time. Before
  # this, each bump needed a human to run butane by hand; PR #211 sat red for
  # exactly that reason. A VIP nobody wants to touch is precisely the component
  # that ends up running a stale image for months.
  #
  # Still fails closed on push-to-develop and on fork PRs, where pushing the
  # fix is impossible or unsafe: a stale render merged to develop would mean
  # the node keeps the old image while git claims otherwise.
  butane-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - run: |
          # renovate: datasource=github-releases depName=coreos/butane
          BUTANE_VERSION=v0.29.0
          curl -fsSL -o /usr/local/bin/butane \
            "https://github.com/coreos/butane/releases/download/${BUTANE_VERSION}/butane-x86_64-unknown-linux-gnu"
          chmod +x /usr/local/bin/butane
      - run: |-
          changed=0
          for bu in $(find kubernetes -name '*.bu'); do
            rendered="$(dirname "$bu")/machineconfig.yaml"
            if ! { echo "---"; butane --strict "$bu"; } | diff -u "$rendered" - ; then
              { echo "---"; butane --strict "$bu"; } > "$rendered"
              echo "::notice file=$bu::regenerated $rendered"
              changed=1
            fi
          done
          echo "BUTANE_CHANGED=$changed" >> "$GITHUB_ENV"
      - name: Commit the regenerated render
        if: env.BUTANE_CHANGED == '1'
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |-
          if [ "$IS_PR" != "true" ] || [ "$SAME_REPO" != "true" ]; then
            echo "::error::render drifts and cannot be auto-committed here. Regenerate locally:"
            echo "::error::  { echo '---'; butane --strict <file>.bu; } > machineconfig.yaml"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(butane): regenerate MachineConfig from .bu source"
          git push origin "HEAD:$HEAD_REF"
