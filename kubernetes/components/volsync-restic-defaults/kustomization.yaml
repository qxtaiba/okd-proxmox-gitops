# yaml-language-server: $schema=https://json.schemastore.org/kustomization
---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Shared defaults for every ReplicationSource and ReplicationDestination in
# the cluster. Per-app ReplicationSources only declare: metadata.name,
# sourcePVC, trigger.schedule, restic.repository,
# restic.volumeSnapshotClassName, restic.cacheCapacity. Per-app bootstrap
# ReplicationDestinations add capacity, storageClassName and accessModes.
patches:
  - path: ./patch.yaml
    target:
      group: volsync.backube
      version: v1alpha1
      kind: ReplicationSource
  - path: ./patch-destination.yaml
    target:
      group: volsync.backube
      version: v1alpha1
      kind: ReplicationDestination
