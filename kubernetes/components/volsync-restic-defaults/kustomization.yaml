# yaml-language-server: $schema=https://json.schemastore.org/kustomization
---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Shared defaults for every ReplicationSource and ReplicationDestination in
# the cluster. Per-app ReplicationSources only declare: metadata.name,
# sourcePVC, trigger.schedule, restic.repository,
# restic.volumeSnapshotClassName, restic.cacheCapacity. Per-app bootstrap
# ReplicationDestinations add capacity, storageClassName and accessModes.
#
# Schedules are staggered 6 minutes apart from 02:00 (plex first, it is the
# largest). Every source snapshots an RBD image on the same QLC NVMe that
# etcd fsyncs to; firing them all at once stacks the snapshot + restic read
# bursts. Pick the next free slot for a new app; 03:15/03:30 belong to the
# tofu-state and etcd backups.
patches:
  - path: ./patch.yaml
    target:
      group: volsync.backube
      version: v1alpha1
      kind: ReplicationSource
  - path: ./patch-destination.yaml
    target:
      group: volsync.backube
      version: v1alpha1
      kind: ReplicationDestination
