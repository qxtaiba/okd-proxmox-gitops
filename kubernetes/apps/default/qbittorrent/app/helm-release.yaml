# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      qbittorrent:
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          name: qbittorrent
        initContainers:
          init-dirs:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0
            command:
              - sh
              - -c
              - mkdir -p /downloads/torrents/complete /downloads/torrents/incomplete
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          clean-lockfile:
            # Stale qbittorrent lockfile/ipc-socket from ungraceful kill or
            # 5.1.x→5.2.0 format change. Tracked upstream: qbittorrent#24164.
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0
            command:
              - sh
              - -c
              - rm -f /config/qBittorrent/lockfile /config/qBittorrent/ipc-socket || true
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          gluetun:
            dependsOn: init-dirs
            restartPolicy: Always
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
            env:
              TZ: Asia/Dubai
              VPN_SERVICE_PROVIDER: protonvpn
              VPN_TYPE: wireguard
              VPN_INTERFACE: wg0
              SERVER_COUNTRIES: Netherlands
              SERVER_CITIES: Amsterdam
              PORT_FORWARD_ONLY: "on"
              WIREGUARD_MTU: "1340"
              # 8888: gluetun's HTTP proxy (below), reachable in-cluster only
              # from Prowlarr and Byparr (networkpolicy.yaml).
              FIREWALL_INPUT_PORTS: "8080,8888"
              FIREWALL_VPN_INPUT_PORTS: "6881"
              FIREWALL_OUTBOUND_SUBNETS: "10.128.0.0/14,172.30.0.0/16,192.168.227.0/24"
              FIREWALL_IPV6: "off"
              UPDATER_PERIOD: 24h
              # VPN egress for indexer traffic. The ISP SNI-blocks specific
              # tracker mirrors (1337x.to, eztvx.to, torrentdownload.info...)
              # while the same hosts answer through Proton, so Prowlarr's "vpn"
              # tagged indexers and Byparr's browser go out through here.
              # Stealth: no Via/X-Forwarded-For headers revealing the proxy.
              HTTPPROXY: "on"
              HTTPPROXY_LISTENING_ADDRESS: ":8888"
              HTTPPROXY_STEALTH: "on"
              # IP targets, not the cloudflare.com/github.com default: the
              # startup check must finish a TCP+TLS dial within 6s of the
              # tunnel coming up, but gluetun's own DNS server restarts with
              # every VPN restart and is often not listening yet. 503 of 543
              # VPN restarts on 2026-10-04/05 were "lookup github.com" failures
              # -- a self-sustaining loop that held the tunnel down for 9h.
              # Both certs carry an IP SAN, so the TLS check stays meaningful.
              HEALTH_TARGET_ADDRESSES: "1.1.1.1:443,8.8.8.8:443"
              UPDATER_VPN_SERVICE_PROVIDERS: protonvpn
              VPN_PORT_FORWARDING: "on"
              VPN_PORT_FORWARDING_UP_COMMAND: >-
                /bin/sh -c 'wget -qO- --retry-connrefused --waitretry=5 --tries=10 --post-data "json={\"listen_port\":{{ "{{" }}PORTS{{ "}}" }}}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
              VPN_PORT_FORWARDING_DOWN_COMMAND: >-
                /bin/sh -c 'wget -qO- --retry-connrefused --post-data "json={\"listen_port\":0}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - (ip rule del table 51820; ip -6 rule del table 51820) || true
            envFrom:
              - secretRef:
                  name: gluetun-secret
            probes:
              # Liveness also requires a live forwarded port. When Proton's
              # NAT-PMP request times out, gluetun logs one ERROR, gives up on
              # port forwarding for the rest of the session, and keeps
              # reporting itself healthy -- qbittorrent then sits unconnectable
              # (seen 2026-10-08: hours of near-zero speed). The control API
              # reports the live state ({"port":0} once forwarding is lost), so
              # three failures (~90s) restart gluetun, which reconnects and
              # renegotiates. Readiness/startup stay on the plain healthcheck so
              # a fresh start has time to negotiate the port.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - >-
                        /gluetun-entrypoint healthcheck >/dev/null && wget -qO- -T 3 http://127.0.0.1:8000/v1/portforward | grep -q '"port":[1-9]'
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /gluetun-entrypoint
                      - healthcheck
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /gluetun-entrypoint
                      - healthcheck
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              seLinuxOptions:
                level: "s0"
              capabilities:
                drop: ["ALL"]
                add: ["NET_ADMIN", "NET_RAW", "CHOWN", "NET_BIND_SERVICE", "DAC_OVERRIDE"]
            # Steady state is 50-110Mi, but startup occasionally spikes: one
            # container hit 381Mi of the old 384Mi limit at 02:45Z on
            # 2026-10-05 and was OOM-killed mid-reconnect, feeding the restart
            # loop. Limit doubled for headroom; the request (what scheduling
            # and KubeMemoryOvercommit count) is unchanged.
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 768Mi
                squat.ai/tun: "1"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.4
            env:
              TZ: Asia/Dubai
              QBT_WEBUI_PORT: "8080"
              QBT_TORRENTING_PORT: "6881"
            lifecycle:
              preStop:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - rm -f /config/qBittorrent/lockfile /config/qBittorrent/ipc-socket
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/app/version
                    port: 8080
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 2000m
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seLinuxOptions:
          level: "s0"
    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: 8080
      # qbittorrent-proxy.default.svc:8888 -> gluetun HTTP proxy (VPN egress)
      proxy:
        controller: qbittorrent
        ports:
          http:
            port: 8888
    persistence:
      config:
        existingClaim: qbittorrent-config
        advancedMounts:
          qbittorrent:
            init-dirs: &config-mount
              - path: /config
            clean-lockfile: *config-mount
            app: *config-mount
      downloads:
        existingClaim: downloads
        advancedMounts:
          qbittorrent:
            init-dirs: &downloads-mount
              - path: /downloads
            app: *downloads-mount
      media:
        existingClaim: media
        advancedMounts:
          qbittorrent:
            app:
              - path: /media
      tmp:
        type: emptyDir
        advancedMounts:
          qbittorrent:
            app:
              - path: /tmp
      gluetun-data:
        type: emptyDir
        advancedMounts:
          qbittorrent:
            gluetun:
              - path: /tmp/gluetun
