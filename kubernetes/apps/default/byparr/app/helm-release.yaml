# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
# Byparr: a FlareSolverr-API-compatible Cloudflare challenge solver (Camoufox,
# i.e. hardened Firefox, instead of FlareSolverr's undetected-chromedriver,
# which no longer clears Turnstile). Prowlarr reaches it as a "FlareSolverr"
# indexer proxy and only routes indexers carrying the matching tag through it.
#
# Internal only: no Route. Egress goes through gluetun's HTTP proxy (VPN), so
# it clears both Cloudflare challenges and the ISP's SNI blocks on mirrors.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: byparr
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: byparr
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      byparr:
        serviceAccount:
          name: byparr
        containers:
          app:
            image:
              repository: ghcr.io/thephaseless/byparr
              tag: 3.0.4
            env:
              TZ: Asia/Dubai
              LOG_LEVEL: info
              # Unset, the locale follows the egress country.
              BROWSER_LOCALE: en-US
              # Egress through gluetun (VPN) so challenges are solved from the
              # Proton exit, past the ISP's SNI blocks on tracker mirrors.
              PROXY_SERVER: http://qbittorrent-proxy.default.svc.cluster.local:8888
            # Plain TCP probes on purpose: Byparr's /health launches a real
            # browser and loads google.com (its own Dockerfile only runs it
            # every 15 minutes), far too heavy for a 10s probe.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8191
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8191
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8191
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              # The Camoufox browser is baked into /cache at image build time,
              # and the browser profile writes beside it, so /cache can be
              # neither read-only nor shadowed by an emptyDir.
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            # Idles at a few hundred MiB but each in-flight challenge holds a
            # browser page: Prowlarr fires several requests per search (front
            # page + search, often in parallel) and 1.5Gi was OOM-killed mid-
            # search on the first real use (2026-10-08). Low request on
            # purpose: pod memory requests sit just under KubeMemoryOvercommit's
            # threshold (54.0 of 54.5GiB); only the limit carries the bursts.
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 2000m
                memory: 2560Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seLinuxOptions:
          level: "s0"
    service:
      app:
        controller: byparr
        ports:
          http:
            port: 8191
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # Firefox/multiprocessing need real shared memory; the container
      # default (64Mi) causes FileNotFoundError in camoufox (Byparr README).
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
