# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
---
# Tdarr's API key. With auth=true and seededApiKey set, Tdarr creates an
# "admin" web user whose password is this key, and every API call (the
# config job, the node) must send it. Generated once in-cluster; also copied
# to the 1Password item "tdarr" for signing in to the UI.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: tdarr-random
spec:
  length: 32
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tdarr-api-key
spec:
  refreshInterval: "0"
  target:
    name: tdarr-api-key
    template:
      data:
        # Must start with tapi_ and contain only [A-Za-z0-9_].
        TDARR_API_KEY: "tapi_{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tdarr-random
