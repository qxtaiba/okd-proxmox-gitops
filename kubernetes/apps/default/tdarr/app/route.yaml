# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/route.openshift.io/route_v1.json
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: tdarr
  labels:
    ingress: grappleberry
spec:
  host: tdarr.grappleberry.xyz
  port:
    targetPort: 8265
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: tdarr
    weight: 100
  wildcardPolicy: None
