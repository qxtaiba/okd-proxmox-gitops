# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: overseerr-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: overseerr-secret
    template:
      data:
        SEERR_API_KEY: "{{ .api_key }}"
        DISCORD_WEBHOOK: "{{ .discord_webhook }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: overseerr
        property: api_key
    # Same channel as Tautulli's "recently added" feed: read-at-leisure
    # media chatter, kept out of the alert channels.
    - secretKey: discord_webhook
      remoteRef:
        key: alertmanager-discord
        property: webhook-url-info
