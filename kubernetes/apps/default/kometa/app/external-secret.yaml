---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kometa
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kometa-secret
    template:
      data:
        # KOMETA_<NAME> env becomes <<name>> inside config.yml.
        KOMETA_PLEXTOKEN: "{{ .plex_token }}"
        KOMETA_TMDBKEY: "{{ .tmdb_api_key }}"
        KOMETA_MDBLISTKEY: "{{ .mdblist_api_key }}"
  data:
    - secretKey: plex_token
      remoteRef:
        key: plex
        property: token
    - secretKey: tmdb_api_key
      remoteRef:
        key: kometa
        property: tmdb_api_key
    - secretKey: mdblist_api_key
      remoteRef:
        key: kometa
        property: mdblist_api_key
