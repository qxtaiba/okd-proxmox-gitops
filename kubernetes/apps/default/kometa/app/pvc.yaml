# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/persistentvolumeclaim.json
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kometa-config
spec:
  # Restore-on-create: on a fresh cluster this PVC stays Pending until the
  # bootstrap ReplicationDestination in volsync.yaml has restored the newest
  # restic snapshot from the NAS, so the app starts on its old data instead
  # of initialising an empty config.
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: kometa-config-bootstrap
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ceph-block
