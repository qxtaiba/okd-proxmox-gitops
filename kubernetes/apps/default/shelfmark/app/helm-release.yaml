# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelfmark
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: shelfmark
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      shelfmark:
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          name: shelfmark
        initContainers:
          init-dirs:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0
            # Shelfmark's non-root mode needs its mounts pre-created and
            # writable by 1000; NFS ignores fsGroup, so make them as 1000.
            command:
              - sh
              - -c
              - mkdir -p /media/books/ingest
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        containers:
          app:
            # Lite: no bundled Chromium. The full image carries ~1.8k scanner
            # findings in that browser (GHSA-5p9r-9763-j3vc) and needs ~2Gi;
            # Cloudflare challenges go to the existing Byparr instead.
            image:
              repository: ghcr.io/calibrain/shelfmark-lite
              tag: v1.6.1
            env:
              TZ: Asia/Dubai
              FLASK_PORT: "8084"
              CONFIG_DIR: /config
              TMP_DIR: /tmp/shelfmark
              ENABLE_LOGGING: "false"
              # Defaults to "none" (open to anyone on the LAN).
              AUTH_METHOD: builtin
              SESSION_COOKIE_SECURE: "true"
              ONBOARDING: "false"
              # Calibre-Web-Automated imports everything dropped here.
              BOOKS_OUTPUT_MODE: folder
              INGEST_DIR: /media/books/ingest
              # Notability takes PDF only; EPUB is kept so CWA can convert it.
              SUPPORTED_FORMATS: pdf,epub
              # Hardcover tracks editions; Open Library kept surfacing first and
              # third editions over the current one.
              METADATA_PROVIDER: hardcover
              HARDCOVER_ENABLED: "true"
              OPENLIBRARY_ENABLED: "true"
              GOOGLEBOOKS_ENABLED: "true"
              PROWLARR_ENABLED: "true"
              PROWLARR_URL: http://prowlarr.default.svc:9696
              # Download clients see /media at the same path as this pod, so
              # completed paths resolve without remote path mappings.
              PROWLARR_TORRENT_CLIENT: qbittorrent
              QBITTORRENT_URL: http://qbittorrent.default.svc:8080
              PROWLARR_USENET_CLIENT: sabnzbd
              SABNZBD_URL: http://sabnzbd.default.svc:8080
              USING_EXTERNAL_BYPASSER: "true"
              EXT_BYPASSER_URL: http://byparr.default.svc:8191
            envFrom:
              - secretRef:
                  name: shelfmark-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 8084
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 8084
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 1000m
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seLinuxOptions:
          level: "s0"
    service:
      app:
        controller: shelfmark
        ports:
          http:
            port: 8084
    persistence:
      config:
        existingClaim: shelfmark-config
        advancedMounts:
          shelfmark:
            app:
              - path: /config
      media:
        existingClaim: media
        globalMounts:
          - path: /media
      tmp:
        type: emptyDir
        advancedMounts:
          shelfmark:
            app:
              - path: /tmp
      home:
        type: emptyDir
        advancedMounts:
          shelfmark:
            app:
              - path: /home/shelfmark
