# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/route.openshift.io/route_v1.json
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: shelfmark
  labels:
    ingress: grappleberry
  annotations:
    # Release searches fan out to every Prowlarr indexer in parallel and wait up
    # to PROWLARR_INDEXER_TIMEOUT (90s) for Cloudflare ones solved via Byparr.
    # The router's 30s default cut them off with a 504 while the backend kept going.
    haproxy.router.openshift.io/timeout: 180s
spec:
  host: shelfmark.grappleberry.xyz
  port:
    targetPort: 8084
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: shelfmark
    weight: 100
  wildcardPolicy: None
