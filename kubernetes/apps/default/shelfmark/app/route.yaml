# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/route.openshift.io/route_v1.json
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: shelfmark
  labels:
    ingress: grappleberry
  annotations:
    # Release searches fan out to every Prowlarr indexer and routinely run
    # past the router's 30s default, which surfaced as a 504 in the UI.
    haproxy.router.openshift.io/timeout: 5m
spec:
  host: shelfmark.grappleberry.xyz
  port:
    targetPort: 8084
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: shelfmark
    weight: 100
  wildcardPolicy: None
