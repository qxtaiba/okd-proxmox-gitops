# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shelfmark
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: shelfmark-secret
  data:
    - secretKey: PROWLARR_API_KEY
      remoteRef:
        key: prowlarr
        property: api_key
    - secretKey: SABNZBD_API_KEY
      remoteRef:
        key: sabnzbd
        property: api_key
    - secretKey: QBITTORRENT_USERNAME
      remoteRef:
        key: qbittorrent
        property: username
    - secretKey: QBITTORRENT_PASSWORD
      remoteRef:
        key: qbittorrent
        property: password
    - secretKey: SHELFMARK_API_KEY
      remoteRef:
        key: shelfmark
        property: api_key
