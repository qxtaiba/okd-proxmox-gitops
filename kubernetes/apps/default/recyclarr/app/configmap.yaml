# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/configmap.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
data:
  recyclarr.yml: |-
    # TRaSH Guides profiles, synced by trash_id so every custom format and score
    # comes from the guide (release-group tiers, streaming boosts, LQ/upscale
    # filters) instead of a hand-picked subset. Profile names are unchanged, so
    # series/movies keep their assignments.
    #
    # Scene is deliberately NOT selected (TRaSH leaves it off by default). It
    # was -10000 here and made Sonarr skip healthy 80-300 seeder scene torrents
    # for dead 1-3 seeder P2P ones when Usenet was DMCA'd (Matlock S2,
    # 2026-10-08). No-RlsGroup/Obfuscated/Retags stay on: on public trackers
    # they filter fakes and re-uploads.
    sonarr:
      sonarr:
        base_url: http://sonarr.default.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY
        delete_old_custom_formats: true
        quality_definition:
          type: series
        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
            reset_unmatched_scores:
              enabled: true
          - trash_id: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p
            reset_unmatched_scores:
              enabled: true
        custom_format_groups:
          add:
            - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats
              select:
                - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
                - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
                - 06d66ab109d4d2eddb2794d21526d140 # Retags
            - trash_id: d776a1ea912a117d66d83b880ff2055d # [HDR Formats] DV (w/o HDR fallback)
            - trash_id: e1053c0ef622df3749fa43c22865663a # [HDR Formats] SDR
              select:
                - 2016d1676f5ee13a5b7257ff86ac9a93 # SDR
    radarr:
      radarr:
        base_url: http://radarr.default.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY
        delete_old_custom_formats: true
        quality_definition:
          type: movie
        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
          - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
        custom_format_groups:
          add:
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # [Unwanted] Unwanted Formats
              select:
                - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
                - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
                - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
            - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76 # [HDR Formats] DV (w/o HDR fallback)
            - trash_id: 47f0d69750de9e16855915fa73bb7b08 # [HDR Formats] SDR
              select:
                - 9c38ebb7384dada637be8899efa68e6f # SDR
