# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationsource_v1alpha1.json
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: radarr-config-backup
spec:
  sourcePVC: radarr-config
  trigger:
    schedule: "12 2 * * *"
  restic:
    repository: volsync-restic-radarr
    volumeSnapshotClassName: csi-ceph-blockpool
    cacheCapacity: 1Gi
---
# Populates radarr-config on first creation (see pvc.yaml).
# `restore-once` fires a single restore and then idles; it never touches
# the live PVC again.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: radarr-config-bootstrap
spec:
  trigger:
    manual: restore-once
  restic:
    repository: volsync-restic-radarr
    volumeSnapshotClassName: csi-ceph-blockpool
    cacheCapacity: 1Gi
    capacity: 5Gi
    storageClassName: ceph-block
    accessModes:
      - ReadWriteOnce
