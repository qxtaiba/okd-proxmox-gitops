# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
---
# Nightly backup of tofu-controller's Terraform state from the Ceph RGW
# bucket to the NAS. Without this, losing Ceph loses the state, and the
# subsequent `tofu apply` collides with resources already present in the
# *arr databases (restored from Volsync) with "resource already exists"
# errors.
#
# Destination: /volume1/backups/tofu-state/<date>/ on the NAS.
# Directory must exist and be writable by the pod UID — see etcd-backup
# and volsync for the same subpath pattern.
# Retention handled inline (keep last 30 days).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tofu-state-backup
spec:
  schedule: "15 3 * * *"
  timeZone: Asia/Dubai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          # tf-runner SA is already bound to nonroot-v2 SCC (see rbac.yaml)
          # which allows runAsUser: 1000. Without this, the pod would fall back
          # to the namespace default SA and fail admission under restricted-v2.
          serviceAccountName: tf-runner
          containers:
            - name: backup
              # AWS CLI from public ECR, not minio/mc: MinIO stopped publishing
              # community images and quay.io/minio/mc went private (401 for
              # anonymous pulls, found 2026-10-04 after the last success on
              # 09-26). Docker Hub is out too -- anonymous pulls are rate
              # limited and this CronJob once sat 3h37m in ImagePullBackOff.
              # RGW speaks S3, so `aws s3 cp --endpoint-url` is a drop-in.
              image: public.ecr.aws/aws-cli/aws-cli:2.37.10
              envFrom:
                - secretRef:
                    name: tofu-state-bucket
                - configMapRef:
                    name: tofu-state-bucket
              env:
                - name: HOME
                  value: /tmp
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TS=$(date +%Y%m%d-%H%M%S)
                  DEST=/backup/${TS}
                  mkdir -p "${DEST}"
                  aws s3 cp --recursive --only-show-errors \
                    --endpoint-url "http://${BUCKET_HOST}:${BUCKET_PORT}" \
                    "s3://${BUCKET_NAME}/" "${DEST}/"
                  # an empty bucket copies nothing and still exits 0
                  [ -n "$(ls -A "${DEST}")" ] || { echo "no objects copied"; exit 1; }
                  echo "pruning tofu-state backups, keeping last 30"
                  cd /backup && \
                    ls -1dt [0-9]*/ 2>/dev/null | tail -n +31 | while read d; do
                      echo "pruning: ${d}"
                      rm -rf "${d}"
                    done
                  echo "tofu-state backup complete: ${TS}"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backup-nfs
                  mountPath: /backup
          volumes:
            - name: backup-nfs
              nfs:
                server: nas.grappleberry.xyz
                path: /volume1/backups/tofu-state
