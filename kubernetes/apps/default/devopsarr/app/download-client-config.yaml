# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
---
# Declarative settings for the download clients. Neither SABnzbd nor
# qBittorrent has a Terraform provider, and their images only template a
# handful of keys from env, so this CronJob pushes the desired state through
# each app's own API (idempotent; re-run hourly to correct UI drift).
# Credentials come from the same devopsarr-secrets the Terraform stack uses.
#
# Run on demand: oc -n default create job --from=cronjob/download-client-config dcc-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: download-client-config
spec:
  schedule: "7 * * * *"
  timeZone: Asia/Dubai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          # The curl image's USER is a name (curl_user), which kubelet cannot
          # verify against runAsNonRoot; pin a UID via the nonroot-v2 SA.
          serviceAccountName: tf-runner
          containers:
            - name: apply
              image: quay.io/curl/curl:8.22.0
              env:
                - name: SAB_URL
                  value: http://sabnzbd.default.svc.cluster.local:8080
                - name: QBT_URL
                  value: http://qbittorrent.default.svc.cluster.local:8080
                - name: SAB_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: devopsarr-secrets
                      key: sabnzbd_api_key
                - name: QBT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: devopsarr-secrets
                      key: qbittorrent_username
                - name: QBT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: devopsarr-secrets
                      key: qbittorrent_password
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  # --- SABnzbd ---
                  # Downloads sit on the NAS media share so imports are hardlinks.
                  # set_config echoes the stored value, so check it actually took.
                  sab_api() {
                    curl -fsS -G "${SAB_URL}/api" --data-urlencode "apikey=${SAB_API_KEY}" -d output=json "$@"
                  }
                  sab_set() { # <section> <name|keyword> <field> <value>
                    if [ "$1" = categories ]; then
                      out=$(sab_api -d mode=set_config -d section=categories -d "name=$2" --data-urlencode "$3=$4")
                    elif [ "$1" = servers ]; then
                      out=$(sab_api -d mode=set_config -d section=servers -d "keyword=$2" --data-urlencode "$3=$4")
                    else
                      out=$(sab_api -d mode=set_config -d "section=$1" -d "keyword=$2" --data-urlencode "value=$4")
                    fi
                    case "${out}" in
                      *"\"$3\":\"$4\""*|*"\"$3\":$4,"*|*"\"$3\":$4}"*) echo "sabnzbd: $1/$2 $3=$4" ;;
                      *) echo "sabnzbd: $1/$2 $3 not applied: ${out}"; return 1 ;;
                    esac
                  }
                  sab_set misc complete_dir complete_dir /media/downloads/usenet/complete
                  # Old posts come from the provider's archive tier, slow per
                  # connection, so throughput scales with connections while
                  # every one stays busy and the article cache stays near
                  # empty (measured 2026-10-09: 30 -> 11-33 MB/s, 60 -> 24-43,
                  # 90 -> 40-87 against the 87.5 cap). Newshosting allows 100;
                  # 90 keeps headroom so reconnects never hit the limit.
                  sab_set servers news.newshosting.com connections 90
                  for cat in sonarr radarr prowlarr; do
                    sab_set categories "${cat}" dir /media/downloads/usenet/complete
                  done
                  # SABnzbd refuses to move the incomplete folder while jobs are
                  # queued; retry on a later run once the queue has drained.
                  queued=$(sab_api -d mode=queue -d limit=1 | sed -n 's/.*"noofslots_total": *\([0-9]*\).*/\1/p')
                  if [ "${queued:-1}" -eq 0 ]; then
                    sab_set misc download_dir download_dir /media/downloads/usenet/incomplete
                  else
                    echo "sabnzbd: misc/download_dir deferred (${queued:-?} jobs queued)"
                  fi

                  # --- qBittorrent ---
                  # Login answers 200 "Ok." (older) or 204 (5.2+); the SID cookie
                  # is the reliable signal either way.
                  jar=/tmp/qbt.cookies
                  curl -fsS -o /dev/null -c "${jar}" --data-urlencode "username=${QBT_USERNAME}" \
                    --data-urlencode "password=${QBT_PASSWORD}" "${QBT_URL}/api/v2/auth/login"
                  grep -q SID "${jar}" || { echo "qbittorrent: login failed"; exit 1; }
                  # Public trackers: pull the curated ngosang list into every
                  # torrent and announce to all of them, re-announcing whenever
                  # gluetun's forwarded port/address changes.
                  curl -fsS -b "${jar}" "${QBT_URL}/api/v2/app/setPreferences" --data-urlencode 'json={
                    "save_path": "/media/downloads/torrents",
                    "temp_path_enabled": false,
                    "temp_path": "/media/downloads/torrents/incomplete",
                    "auto_tmm_enabled": false,
                    "add_trackers_from_url_enabled": true,
                    "add_trackers_url": "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best.txt",
                    "announce_to_all_trackers": true,
                    "announce_to_all_tiers": true,
                    "reannounce_when_address_changed": true,
                    "merge_trackers": true,
                    "max_connec": 600,
                    "max_connec_per_torrent": 150
                  }'
                  curl -fsS -b "${jar}" "${QBT_URL}/api/v2/app/preferences" \
                    | grep -q '"save_path":"/media/downloads/torrents"' \
                    || { echo "qbittorrent: preferences not applied"; exit 1; }
                  echo "qbittorrent: preferences applied"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
          volumes:
            - name: tmp
              emptyDir: {}
