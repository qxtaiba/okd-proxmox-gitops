# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
---
# Re-search monitored items that have no file, every 6 hours (see
# config/arr-research.py). WAR S01E01-02 sat missing for 10 days after
# every usenet copy failed: nothing re-searches without this.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arr-research-missing
spec:
  schedule: "13 */6 * * *"
  timeZone: Asia/Dubai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: tf-runner
          containers:
            - name: reconcile
              image: public.ecr.aws/docker/library/python:3.14-alpine
              command: ["python3", "/config/arr-research.py"]
              env:
                - {name: MODE, value: missing}
                - {name: SONARR_API_KEY, valueFrom: {secretKeyRef: {name: devopsarr-secrets, key: sonarr_api_key}}}
                - {name: RADARR_API_KEY, valueFrom: {secretKeyRef: {name: devopsarr-secrets, key: radarr_api_key}}}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: arr-research
---
# Re-search monitored items below their quality cutoff, daily at 04:43.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arr-research-cutoff
spec:
  schedule: "43 4 * * *"
  timeZone: Asia/Dubai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: tf-runner
          containers:
            - name: reconcile
              image: public.ecr.aws/docker/library/python:3.14-alpine
              command: ["python3", "/config/arr-research.py"]
              env:
                - {name: MODE, value: cutoff}
                - {name: SONARR_API_KEY, valueFrom: {secretKeyRef: {name: devopsarr-secrets, key: sonarr_api_key}}}
                - {name: RADARR_API_KEY, valueFrom: {secretKeyRef: {name: devopsarr-secrets, key: radarr_api_key}}}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: arr-research
