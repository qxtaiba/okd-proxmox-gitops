# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationsource_v1alpha1.json
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: calibre-web-automated-config-backup
spec:
  sourcePVC: calibre-web-automated-config
  trigger:
    schedule: "42 3 * * *"
  restic:
    repository: volsync-restic-calibre-web-automated
    volumeSnapshotClassName: csi-ceph-blockpool
    cacheCapacity: 2Gi
---
# Populates calibre-web-automated-config on first creation (see pvc.yaml).
# `restore-once` fires a single restore and then idles; it never touches
# the live PVC again.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: calibre-web-automated-config-bootstrap
spec:
  trigger:
    manual: restore-once
  restic:
    repository: volsync-restic-calibre-web-automated
    volumeSnapshotClassName: csi-ceph-blockpool
    cacheCapacity: 2Gi
    capacity: 10Gi
    storageClassName: ceph-block
    accessModes:
      - ReadWriteOnce
