# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calibre-web-automated
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: calibre-web-automated-secret
  data:
    - secretKey: CWA_USERNAME
      remoteRef:
        key: calibre-web-automated
        property: username
    - secretKey: CWA_PASSWORD
      remoteRef:
        key: calibre-web-automated
        property: password
    - secretKey: HARDCOVER_TOKEN
      remoteRef:
        key: hardcover
        property: api_key
