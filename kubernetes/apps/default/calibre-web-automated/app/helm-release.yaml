# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre-web-automated
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: calibre-web-automated
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      calibre-web-automated:
        # metadata.db is SQLite on NFS: never let two pods open it at once.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          name: calibre-web-automated
        initContainers:
          init-dirs:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0
            # Create the subPath targets as 1000 before kubelet would create
            # them as root (NFS ignores fsGroup).
            command:
              - sh
              - -c
              - mkdir -p /media/books/ingest /media/books/library
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          configure:
            image:
              repository: docker.io/crocodilestick/calibre-web-automated
              tag: v4.0.8
            command: ["/lsiopy/bin/python3", "/scripts/configure.py"]
            envFrom:
              - secretRef:
                  name: calibre-web-automated-secret
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        containers:
          app:
            image:
              repository: docker.io/crocodilestick/calibre-web-automated
              tag: v4.0.8
            env:
              TZ: Asia/Dubai
              PUID: "1000"
              PGID: "1000"
              # Library + metadata.db live on the NAS: disables SQLite WAL and
              # the recursive chown, and polls the ingest folder, since inotify
              # never sees files Shelfmark writes from another pod.
              NETWORK_SHARE_MODE: "true"
              HARDCOVER_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: calibre-web-automated-secret
                    key: HARDCOVER_TOKEN
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8083
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8083
                  periodSeconds: 10
                  failureThreshold: 60
            # s6-overlay starts as root and needs a writable root fs and the
            # default capability set to drop privileges to PUID/PGID.
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: false
            # Calibre's ebook-convert spikes during EPUB->PDF; idle is low.
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 2000m
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seLinuxOptions:
          level: "s0"
    service:
      app:
        controller: calibre-web-automated
        ports:
          http:
            port: 8083
    persistence:
      config:
        existingClaim: calibre-web-automated-config
        advancedMounts:
          calibre-web-automated:
            configure:
              - path: /config
            app:
              - path: /config
      configure:
        type: configMap
        name: calibre-web-automated-configure
        advancedMounts:
          calibre-web-automated:
            configure:
              - path: /scripts
                readOnly: true
      media:
        existingClaim: media
        advancedMounts:
          calibre-web-automated:
            init-dirs:
              - path: /media
            app:
              - path: /cwa-book-ingest
                subPath: books/ingest
              - path: /calibre-library
                subPath: books/library
