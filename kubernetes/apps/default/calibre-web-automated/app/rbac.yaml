---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: calibre-web-automated
---
# The image is linuxserver-style s6-overlay: it must start as root and drop
# to PUID/PGID itself, and fails under runAsNonRoot (upstream CWA #167).
# anyuid grants RunAsAny with CRI-O's default capability set, which covers
# s6's chown/setuid; nothing beyond that (cf. qbittorrent-gluetun) is needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: calibre-web-automated-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: calibre-web-automated
