# yaml-language-server: $schema=https://json.schemastore.org/kustomization
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./oci-repository.yaml
  - ./pvc.yaml
  - ./external-secret.yaml
  - ./rbac.yaml
  - ./helm-release.yaml
  - ./route.yaml
  - ./volsync.yaml
configMapGenerator:
  - name: calibre-web-automated-set-login
    files:
      - set-login.py=./config/set-login.py
generatorOptions:
  disableNameSuffixHash: true
components:
  - ../../../../components/volsync-restic-defaults
