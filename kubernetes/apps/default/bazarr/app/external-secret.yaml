# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
---
# Bazarr's own API key is only used in-cluster (the profiles job), so it is
# generated here (once; a rebuild generates a new one). Sonarr/Radarr keys
# come from 1Password. `@str` stops Dynaconf parsing an all-digit key as an
# int, which Bazarr's validator would silently reset.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: bazarr-random
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: true
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr-generated
spec:
  refreshInterval: "0"
  target:
    name: bazarr-generated
    template:
      data:
        DYNACONF_AUTH__APIKEY: "@str {{ .password }}"
        BAZARR_API_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bazarr-random
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bazarr-secret
    template:
      data:
        DYNACONF_SONARR__APIKEY: "@str {{ .sonarr_api_key }}"
        DYNACONF_RADARR__APIKEY: "@str {{ .radarr_api_key }}"
  data:
    - secretKey: sonarr_api_key
      remoteRef:
        key: sonarr
        property: api_key
    - secretKey: radarr_api_key
      remoteRef:
        key: radarr
        property: api_key
