# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
---
# Tautulli's API key and web password are only used inside the cluster (the
# notifier job, and a login hash nobody types: you sign in with Plex), so they
# are generated here rather than kept in 1Password. refreshInterval 0 means
# generate once; a rebuild simply generates new ones.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: tautulli-random
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: true
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tautulli-generated
spec:
  refreshInterval: "0"
  target:
    name: tautulli-generated
    template:
      data:
        TAUTULLI_API_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tautulli-random
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tautulli-login
spec:
  refreshInterval: "0"
  target:
    name: tautulli-login
    template:
      data:
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tautulli-random
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tautulli
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tautulli-secret
    template:
      data:
        DISCORD_WEBHOOK: "{{ .discord_webhook }}"
  data:
    # No Plex token here on purpose. The 1Password `plex` token belongs to the
    # Plex SERVER's device; plex.tv stamps the caller's X-Plex-Device-Name and
    # version onto whichever device owns the token, so Tautulli calling
    # plex.tv with it renamed the server to "tautulli-<pod> (Tautulli)
    # v2.18.2" and Plex apps demanded a server upgrade. Tautulli signs in with
    # its own token (Settings > Plex Media Server > Fetch New Token), kept in
    # its config.ini on the backed-up PVC.
    - secretKey: discord_webhook
      remoteRef:
        key: alertmanager-discord
        property: webhook-url-info
