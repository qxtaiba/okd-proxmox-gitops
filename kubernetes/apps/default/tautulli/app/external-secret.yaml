# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
---
# Tautulli's API key and web password are only used inside the cluster (the
# notifier job, and a login hash nobody types: you sign in with Plex), so they
# are generated here rather than kept in 1Password. refreshInterval 0 means
# generate once; a rebuild simply generates new ones.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: tautulli-random
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: true
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tautulli-generated
spec:
  refreshInterval: "0"
  target:
    name: tautulli-generated
    template:
      data:
        TAUTULLI_API_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tautulli-random
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tautulli-login
spec:
  refreshInterval: "0"
  target:
    name: tautulli-login
    template:
      data:
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tautulli-random
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tautulli
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tautulli-secret
    template:
      data:
        TAUTULLI_PMS_TOKEN: "{{ .plex_token }}"
        DISCORD_WEBHOOK: "{{ .discord_webhook }}"
  data:
    - secretKey: plex_token
      remoteRef:
        key: plex
        property: token
    - secretKey: discord_webhook
      remoteRef:
        key: alertmanager-discord
        property: webhook-url-info
