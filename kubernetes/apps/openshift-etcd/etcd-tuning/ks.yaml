# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: etcd-tuning
  namespace: flux-system
spec:
  path: ./kubernetes/apps/openshift-etcd/etcd-tuning/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  # The Etcd CR is a cluster singleton owned by the etcd operator; never
  # let Flux delete it. The operator rolls etcd one member at a time, so
  # don't block on the rollout either.
  timeout: 5m
  retryInterval: 1m
  prune: false
  wait: false
