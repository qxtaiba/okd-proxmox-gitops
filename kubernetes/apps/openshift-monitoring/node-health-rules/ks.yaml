# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-health-rules
  namespace: flux-system
spec:
  # Platform rules: user-workload rules get namespace= enforced and cannot
  # see node-exporter metrics, so these live where the platform Prometheus
  # (which selects every PrometheusRule in openshift-monitoring) loads them.
  targetNamespace: openshift-monitoring
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/apps/openshift-monitoring/node-health-rules/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
