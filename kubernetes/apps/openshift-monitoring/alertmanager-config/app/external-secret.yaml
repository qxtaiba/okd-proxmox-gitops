# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
---
# Supplies the two credentials Alertmanager reads as files, mounted at
# /etc/alertmanager/secrets/alertmanager-discord/ by `alertmanagerMain.secrets`
# in cluster-monitoring-config.
#
# 1Password item `alertmanager-discord` in the Kubernetes vault needs fields:
#   webhook-url          -- Discord webhook for #alerts-warning
#   webhook-url-critical -- Discord webhook for #alerts-critical
#   webhook-url-info     -- Discord webhook for #alerts-info (shared with Flux)
#   healthchecks-url     -- healthchecks.io ping URL for the Watchdog check
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-discord
  data:
    - secretKey: webhook-url
      remoteRef:
        key: alertmanager-discord
        property: webhook-url
    - secretKey: webhook-url-critical
      remoteRef:
        key: alertmanager-discord
        property: webhook-url-critical
    - secretKey: webhook-url-info
      remoteRef:
        key: alertmanager-discord
        property: webhook-url-info
    - secretKey: healthchecks-url
      remoteRef:
        key: alertmanager-discord
        property: healthchecks-url
