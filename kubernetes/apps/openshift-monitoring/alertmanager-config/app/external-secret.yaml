# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
---
# Renders Alertmanager's whole config, injecting the three values that must
# not live in Git. Alertmanager cannot read a Kubernetes Secret from its own
# config, and while `bot_token_file` exists, Alertmanager 0.29.0 has NO
# `chat_id_file` (amtool: "field chat_id_file not found in type config.plain"),
# so the file-indirection trick cannot cover every value -- templating the
# config here is what keeps the chat id and ping URL out of the repo.
#
# Safe to template because the config below contains no Go template syntax of
# its own. If a custom Telegram `message:` is ever added it MUST escape its
# braces as {{ `{{` }}, or external-secrets will consume them first.
#
# 1Password item `alertmanager-telegram` in the Kubernetes vault needs fields:
#   bot-token        -- from @BotFather
#   chat-id          -- from https://api.telegram.org/bot<TOKEN>/getUpdates
#   healthchecks-url -- healthchecks.io ping URL for the Watchdog check
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-main
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-main
    # Merge, not Owner: cluster-monitoring-operator seeds this Secret, and
    # Owner would make external-secrets delete it if this resource is ever
    # removed, leaving Alertmanager with no config at all.
    creationPolicy: Merge
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m

          # Kept from the OKD default: a firing critical mutes the matching
          # warning/info for the same alert, so one incident is one message.
          inhibit_rules:
            - source_matchers:
                - severity = critical
              target_matchers:
                - severity =~ warning|info
              equal: [namespace, alertname]
            - source_matchers:
                - severity = warning
              target_matchers:
                - severity = info
              equal: [namespace, alertname]

          route:
            group_by: [namespace, alertname]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            receiver: Default
            routes:
              # Watchdog fires forever by design. Pinging healthchecks.io on
              # every repeat turns it into a dead-man's switch: if this
              # cluster, its Prometheus or this Alertmanager dies, the pings
              # stop and healthchecks.io notifies out-of-band. Nothing running
              # IN the cluster can report that the cluster is gone. 5m repeat
              # against a 10m period + 5m grace detects death in ~15m.
              - matchers: [alertname = Watchdog]
                receiver: Watchdog
                group_wait: 0s
                group_interval: 5m
                repeat_interval: 5m

              # Permanent facts about this cluster, not incidents:
              # InsightsDisabled (deliberate), UpdateAvailable (informational),
              # KubeCPUOvercommit + SystemMemoryExceedsReservation (unavoidable
              # on a 3-node compacted control plane at ~75% CPU requests).
              - matchers:
                  - alertname =~ InsightsDisabled|UpdateAvailable|KubeCPUOvercommit|SystemMemoryExceedsReservation
                receiver: Drop

              - matchers: [severity = info]
                receiver: Drop

              - matchers: [severity = critical]
                receiver: Critical
                repeat_interval: 1h

          receivers:
            - name: Drop

            - name: Default
              telegram_configs:
                - bot_token: "{{ .bot_token }}"
                  chat_id: {{ .chat_id }}
                  parse_mode: HTML
                  send_resolved: true

            - name: Critical
              telegram_configs:
                - bot_token: "{{ .bot_token }}"
                  chat_id: {{ .chat_id }}
                  parse_mode: HTML
                  send_resolved: true

            - name: Watchdog
              webhook_configs:
                - url: "{{ .healthchecks_url }}"
                  send_resolved: false
  data:
    - secretKey: bot_token
      remoteRef:
        key: alertmanager-telegram
        property: bot-token
    - secretKey: chat_id
      remoteRef:
        key: alertmanager-telegram
        property: chat-id
    - secretKey: healthchecks_url
      remoteRef:
        key: alertmanager-telegram
        property: healthchecks-url
