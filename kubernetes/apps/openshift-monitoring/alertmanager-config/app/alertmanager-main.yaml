# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/secret.json
---
# Alertmanager's config. It lives in a Secret only because that is the shape
# cluster-monitoring-operator seeds -- it contains NO secret material. The
# Discord webhook and the healthchecks.io ping URL are read from files mounted
# by `alertmanagerMain.secrets` in cluster-monitoring-config and populated by
# the alertmanager-discord ExternalSecret, so the config stays plain reviewable
# YAML in Git.
#
# Verified on Alertmanager 0.29.0 with amtool: `webhook_url_file` (discord) and
# `url_file` (webhook) both exist, and an EMPTY credential file still passes
# check-config -- *_file values are read when a notification is sent, not at
# config load. A blank or rotated-away credential therefore costs notifications
# and can never leave Alertmanager unable to start.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-main
  namespace: openshift-monitoring
type: Opaque
stringData:
  alertmanager.yaml: |-
    global:
      resolve_timeout: 5m

    # Kept from the OKD default: a firing critical mutes the matching
    # warning/info for the same alert, so one incident is one message.
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal: [namespace, alertname]
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal: [namespace, alertname]

      # The two rules above `equal: [namespace, alertname]`, so they only
      # dedupe an alert against ITSELF at a lower severity. Ceph never does
      # that -- each tier is a differently-named alert -- so a single incident
      # currently delivers every tier at once, across two channels. These pairs
      # key on namespace alone and name both ends explicitly.
      - source_matchers: [alertname = CephHealthError]
        target_matchers: [alertname = CephHealthWarning]
        equal: [namespace]
      - source_matchers: [alertname = CephOSDFull]
        target_matchers:
          - alertname =~ CephOSDNearFull|CephOSDBackfillFull
        equal: [namespace]
      - source_matchers: [alertname = CephPoolFull]
        target_matchers:
          - alertname =~ CephPoolNearFull|CephPoolBackfillFull
        equal: [namespace]
      - source_matchers: [alertname = CephMonDownQuorumAtRisk]
        target_matchers: [alertname = CephMonDown]
        equal: [namespace]
      - source_matchers: [alertname = CephOSDDownHigh]
        target_matchers: [alertname = CephOSDDown]
        equal: [namespace]
      - source_matchers: [alertname = CephFilesystemOffline]
        target_matchers:
          - alertname =~ CephFilesystemDegraded|CephFilesystemReadOnly
        equal: [namespace]
      # A node being down explains every daemon on it being down.
      - source_matchers: [alertname = CephOSDHostDown]
        target_matchers: [alertname =~ CephOSDDown|CephOSDDownHigh]
        equal: [namespace]

    route:
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: Default
      routes:
        # Watchdog fires forever by design. Pinging healthchecks.io on every
        # repeat turns it into a dead-man's switch: if this cluster, its
        # Prometheus or this Alertmanager dies, the pings stop and
        # healthchecks.io notifies out-of-band. Nothing running IN the cluster
        # can report that the cluster is gone. 5m repeat against a 10m period
        # + 5m grace detects death in ~15m.
        - matchers: [alertname = Watchdog]
          receiver: Watchdog
          group_wait: 0s
          group_interval: 5m
          repeat_interval: 5m

        # Second dead-man's switch, for the OTHER alerting path. `Watchdog`
        # above is a platform rule from prometheus-k8s; every user rule --
        # Ceph, Flux, cert-manager, API VIP, VolSync, workload health --
        # is evaluated by Thanos Ruler instead. If the ruler stops evaluating,
        # all of those go silent while the platform Watchdog keeps pinging and
        # healthchecks.io keeps reporting the cluster healthy.
        - matchers: [alertname = UserWorkloadWatchdog]
          receiver: UserWorkloadWatchdog
          group_wait: 0s
          group_interval: 5m
          repeat_interval: 5m

        # Ceph's upstream rules are tuned for clusters with 5 mons and dozens
        # of OSDs, where one daemon down is not quorum-critical. Here there are
        # exactly 3 OSDs and 3 mons, one per node, so a single planned reboot
        # trips all of these -- and CephOSDDownHigh is `for: 0` against a 10%
        # threshold, meaning one OSD of three = 33% fires instantly, straight
        # to mobile push. A MachineConfig rollout reboots all three nodes in
        # sequence: three pages per rollout.
        #
        # CephMonClockSkew is here for a different reason than the rest: its
        # rule is `for: 60s` while ceph only re-measures skew every
        # mon_timecheck_interval = 300s. One perturbed timecheck round fires
        # it and the next round five minutes later clears it -- fire, resolve,
        # repeat, forever. The clocks are fine: chrony reports microsecond
        # offsets against a 50ms threshold and ceph measures skew: 0 on all
        # three mons. The blips track VM clock jitter under Proxmox host load.
        #
        # group_wait does the job that `for:` would, without index-patching a
        # chart-generated rule list (which breaks silently when upstream
        # reorders). Nothing is sent unless the condition survives 15 minutes,
        # which a rolling reboot never does and a real failure always does.
        - matchers:
            - alertname =~ CephOSDDownHigh|CephOSDFlapping|CephMonDown|CephMonDownQuorumAtRisk|CephFilesystemInsufficientStandby|CephPoolBackfillFull|CephOSDHostDown|CephMonClockSkew
          receiver: Critical
          group_wait: 15m
          group_interval: 15m
          repeat_interval: 1h

        # Permanently-true states, not incidents, and none of them will change
        # without a deliberate config change: InsightsDisabled (switched off on
        # purpose), KubeCPUOvercommit and SystemMemoryExceedsReservation
        # (unavoidable on a 3-node compacted control plane at ~75% CPU
        # requests). Dropped rather than sent to Info, because an alert that
        # can never clear teaches you to ignore the channel it lands in.
        - matchers:
            - alertname =~ InsightsDisabled|KubeCPUOvercommit|SystemMemoryExceedsReservation
          receiver: Drop

        # Everything else at info severity -- notably UpdateAvailable, which is
        # how a new OKD release gets noticed. Low frequency and no resolved
        # messages, because this channel is read at leisure, not reacted to.
        - matchers: [severity = info]
          receiver: Info
          repeat_interval: 24h

        - matchers: [severity = critical]
          receiver: Critical
          repeat_interval: 1h

    receivers:
      - name: Drop

      - name: Default
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true

      # Separate webhook, and therefore a separate Discord channel, so mobile
      # push can be enabled on criticals alone. Warnings land in #alerts-warning
      # where they can be read at leisure without waking anyone.
      - name: Critical
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url-critical
            send_resolved: true

      # Shares a channel (and therefore a webhook) with the Flux deploy feed:
      # both are "read when you feel like it" material, and one muted channel
      # beats two.
      - name: Info
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url-info
            send_resolved: false

      - name: UserWorkloadWatchdog
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-discord/healthchecks-url-uwm
            send_resolved: false

      - name: Watchdog
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-discord/healthchecks-url
            send_resolved: false
