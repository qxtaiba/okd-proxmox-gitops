# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: user-workload-config
  namespace: flux-system
spec:
  # CMO reads user-workload-monitoring-config ONLY from
  # openshift-user-workload-monitoring. Targeting openshift-monitoring put a
  # perfectly valid ConfigMap somewhere nothing consumes it, so none of the
  # settings below ever applied: UWM Prometheus ran with no retention and an
  # emptyDir volume, holding ~25h of history instead of 7d on Ceph and losing
  # all of it on every pod restart or node drain.
  targetNamespace: openshift-user-workload-monitoring
  path: ./kubernetes/apps/openshift-monitoring/user-workload-config/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: flux-system
  interval: 10m
  timeout: 5m
  retryInterval: 1m
  prune: true
  wait: true
