# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/configmap.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
data:
  config.yaml: |-
    enableUserWorkload: true
    prometheusK8s:
      retention: 15d
      # Time-based retention alone leaves nothing bounding the TSDB by size.
      # The two Prometheus PVCs are 92% of the okd-rbd pool and ~70% of all
      # Ceph write traffic, and sit at 68.8% of 50Gi at steady state -- a ~45%
      # series increase (one chatty exporter, one high-cardinality CRD) fills
      # the volume and takes out both replicas. This converts that into
      # silently shorter history.
      retentionSize: 40GiB
      # CMO defaults to requests cpu=70m memory=1Gi while actual usage is
      # ~350m / 3.6Gi, peaking at 4.6Gi -- roughly 7Gi of memory per pair that
      # the scheduler cannot see, on nodes already near 75% CPU requests.
      # No memory limit on purpose: an OOMKilled Prometheus loses the head block.
      # 3Gi, not the ~4Gi it actually peaks at. Requesting true usage on both
      # replicas pushed cluster memory requests past the single-node-failure
      # budget (61.0GiB requested vs 56.5GiB available with one node removed)
      # and made KubeMemoryOvercommit fire permanently. 3Gi keeps the
      # scheduler honest enough -- CMO's default was 1Gi against 3.6Gi actual
      # -- while leaving headroom. The remaining gap is a real capacity
      # statement about a 3-node cluster, not something to tune away.
      resources:
        requests:
          cpu: 200m
          memory: 3Gi
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-block
          resources:
            requests:
              storage: 50Gi
    alertmanagerMain:
      # Mounted at /etc/alertmanager/secrets/alertmanager-discord/ so
      # alertmanager.yaml can reference webhook_url_file / url_file instead of
      # embedding credentials. Populated by the alertmanager-discord
      # ExternalSecret; Alertmanager cannot read a Secret from its config.
      secrets:
        - alertmanager-discord
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-block
          resources:
            requests:
              storage: 10Gi
    prometheusOperator:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
    kubeStateMetrics:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
    openshiftStateMetrics:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
    telemeterClient:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
    thanosQuerier:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
    monitoringPlugin:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
    metricsServer:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
