# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafana_v1beta1.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    grafana.internal/instance: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "false"
    auth.anonymous:
      enabled: "false"
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    server:
      enable_gzip: "true"
      root_url: https://grafana.grappleberry.xyz
  deployment:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: GF_SECURITY_ADMIN_PASSWORD
              # 256Mi was below Grafana's working set. It never OOM-killed --
              # the kernel instead reclaimed Grafana's own file-backed pages
              # (binary, plugins, sqlite) and it faulted them straight back
              # in: 19.9M major faults in 43h, ~3 GB/s of reads off the NVMe
              # shared by all three masters, which dragged etcd commit p99
              # from ~8ms to ~80ms and tripped BlueStore slow-op warnings.
              # A pod pinned at memory.max with rising major faults is the
              # tell; OOMKilled never appears.
              resources:
                requests:
                  cpu: 100m
                  memory: 384Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          securityContext:
            runAsNonRoot: true
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: ceph-block
  disableDefaultSecurityContext: All
