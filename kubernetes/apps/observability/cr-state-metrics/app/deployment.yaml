# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps/deployment_v1.json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cr-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cr-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cr-state-metrics
    spec:
      serviceAccountName: cr-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args:
            # --resources="" disables every built-in collector: the platform
            # kube-state-metrics already exports all core objects, and shipping
            # a second copy would double every kube_* series in Prometheus.
            - --resources=
            - --custom-resource-state-config-file=/etc/kube-state-metrics/config.yaml
            - --custom-resource-state-only=true
            - --host=0.0.0.0
            - --port=8080
            - --telemetry-host=0.0.0.0
            - --telemetry-port=8081
          ports:
            - name: http-metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          volumeMounts:
            - name: config
              mountPath: /etc/kube-state-metrics
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Health endpoints live on the MAIN port (8080), not the telemetry
          # port -- 8081 serves only kube-state-metrics' own /metrics and
          # answers 404 to anything else, which crashlooped this container
          # every ~35s while its logs showed a perfectly healthy exporter.
          # Ports and paths match upstream kube-state-metrics.
          livenessProbe:
            httpGet:
              path: /livez
              port: http-metrics
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
      volumes:
        - name: config
          configMap:
            name: cr-state-metrics-config
