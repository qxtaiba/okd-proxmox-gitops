# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.authorization.k8s.io/clusterrole_v1.json
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cr-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cr-state-metrics
rules:
  # kube-state-metrics resolves each configured GroupVersionKind against the
  # CRD API before it can build a collector for it. Without this the process
  # starts, serves /metrics, reports healthy -- and exports NOTHING, logging
  # only "customresourcedefinitions.apiextensions.k8s.io is forbidden" in a
  # reflector retry loop. Exactly the silent-green failure the CRStateMetricsAbsent
  # alert exists to catch.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  # Read-only on the rook CRs whose status we turn into metrics. Deliberately
  # narrow: this exporter never needs core objects, and kube-state-metrics
  # only reads .status, never writes.
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters, cephfilesystems]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cr-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cr-state-metrics
subjects:
  - kind: ServiceAccount
    name: cr-state-metrics
    namespace: observability
