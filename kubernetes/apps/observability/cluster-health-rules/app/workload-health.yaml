apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: workload-health
  namespace: metallb-system
spec:
  groups:
    - name: workload-health.rules
      rules:
        - alert: NamespacePodCrashLooping
          expr: |-
            max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
          for: 15m
          annotations:
            summary: >-
              {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is crashlooping
          labels:
            severity: warning
        - alert: NamespacePodNotReady
          expr: |-
            sum by (namespace, pod) (
              max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"})
              * on (namespace, pod) group_left(owner_kind)
              topk by (namespace, pod) (1, max by (namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"}))
            ) > 0
          for: 15m
          annotations:
            summary: >-
              {{ $labels.namespace }}/{{ $labels.pod }} has been not-ready for 15m
          labels:
            severity: warning
        - alert: NamespaceDeploymentReplicasMismatch
          expr: |-
            (kube_deployment_spec_replicas != kube_deployment_status_replicas_available)
              and (changes(kube_deployment_status_replicas_updated[10m]) == 0)
          for: 15m
          annotations:
            summary: >-
              Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has not matched its replica count for 15m
          labels:
            severity: warning
        # The recency guard is load-bearing. failedJobsHistoryLimit retains a
        # failed Job until a FOURTH failure evicts it, so an unguarded
        # `kube_job_failed > 0` keeps firing on history forever -- this rule
        # found three genuine etcd-backup failures on its first run, from 111,
        # 40 and 25 days ago, long since remediated. Upstream's KubeJobFailed
        # shares the unguarded expression and gets away with it only because
        # most Jobs are garbage-collected; a CronJob with a failed-history
        # limit breaks that assumption.
        #
        # 48h covers a daily schedule missing up to two consecutive runs.
        - alert: NamespaceJobFailed
          expr: |-
            kube_job_failed > 0
              and on (namespace, job_name) (time() - kube_job_status_start_time < 172800)
          for: 15m
          annotations:
            summary: >-
              Job {{ $labels.namespace }}/{{ $labels.job_name }} failed
          labels:
            severity: warning
        - alert: NamespacePersistentVolumeFillingUp
          expr: |-
            kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
              and kubelet_volume_stats_used_bytes > 0
              and predict_linear(kubelet_volume_stats_available_bytes[6h], 4 * 24 * 3600) < 0
          for: 1h
          annotations:
            summary: >-
              PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is below 15% free and trending full
          labels:
            severity: warning
        # A container that can never start is invisible to every rule above.
        # Found live 2026-09-13: default/tofu-state-backup sat in
        # ImagePullBackOff for 159 minutes, guarding Terraform state, with
        # nothing alerting -- KubePodNotReady excludes owner_kind=Job,
        # kube_job_failed stays 0 because the Job retries forever rather than
        # failing, and the crashloop rule above only matches CrashLoopBackOff.
        #
        # Same shape as the etcd-backup gap: a job that never fails is never
        # noticed.
        - alert: NamespaceContainerStuck
          # Aggregated by container, NOT by reason. kubelet reports a failing
          # pull as both ErrImagePull and ImagePullBackOff, so keeping `reason`
          # in the label set turns one broken container into two independent
          # alert series that fire and resolve separately -- observed on
          # default/tofu-state-backup, which delivered a firing and a resolved
          # message for the same problem.
          expr: |-
            max by (namespace, pod, container) (
              max_over_time(kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError|InvalidImageName"}[10m])
            ) >= 1
          for: 20m
          annotations:
            summary: >-
              {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} cannot start
          labels:
            severity: warning
