# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: polymaker-recorder
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: polymaker-recorder
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      recorder:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          name: polymaker
        initContainers:
          gluetun:
            restartPolicy: Always
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
            env:
              TZ: Asia/Dubai
              VPN_SERVICE_PROVIDER: protonvpn
              VPN_TYPE: wireguard
              VPN_INTERFACE: wg0
              # API-allowed per polymarket-ref/docs/trading/geoblock.md (IE is frontend-only restricted)
              SERVER_COUNTRIES: Ireland
              WIREGUARD_MTU: "1340"
              FIREWALL_INPUT_PORTS: "9108"
              FIREWALL_OUTBOUND_SUBNETS: "10.128.0.0/14,172.30.0.0/16,192.168.227.0/24"
              FIREWALL_IPV6: "off"
              UPDATER_PERIOD: 24h
              UPDATER_VPN_SERVICE_PROVIDERS: protonvpn
              # IP targets: gluetun's DNS restarts with the tunnel (qbittorrent incident 2026-10-05)
              HEALTH_TARGET_ADDRESSES: "1.1.1.1:443,8.8.8.8:443"
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - (ip rule del table 51820; ip -6 rule del table 51820) || true
            envFrom:
              - secretRef:
                  name: polymaker-gluetun-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [/gluetun-entrypoint, healthcheck]
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [/gluetun-entrypoint, healthcheck]
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              seLinuxOptions:
                level: "s0"
              capabilities:
                drop: ["ALL"]
                add: ["NET_ADMIN", "NET_RAW", "CHOWN", "NET_BIND_SERVICE", "DAC_OVERRIDE"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 768Mi
                squat.ai/tun: "1"
        containers:
          app:
            image:
              repository: ghcr.io/qxtaiba/poly-maker
              tag: 9f92053475f38eb62ad52a5f76a11a82464b761a
            args: ["record", "--root", "/data/recordings", "--port", "9108"]
            env:
              TZ: UTC
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: 9108
                  periodSeconds: 30
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      recorder:
        controller: recorder
        labels:
          app.kubernetes.io/component: polymaker-recorder-metrics
        ports:
          metrics:
            port: 9108
    persistence:
      data:
        existingClaim: polymaker-recordings
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
