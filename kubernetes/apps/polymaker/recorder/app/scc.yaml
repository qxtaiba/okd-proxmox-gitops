# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/security.openshift.io/securitycontextconstraints_v1.json
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: polymaker-gluetun
allowHostNetwork: false
allowHostPorts: false
allowPrivilegedContainer: false
allowedCapabilities:
  - NET_ADMIN
  - NET_RAW
  - CHOWN
  - NET_BIND_SERVICE
  - DAC_OVERRIDE
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
---
# OpenShift only pre-creates system:openshift:scc:<name> ClusterRoles for its
# built-in SCCs; a custom SCC needs its own `use` role or the RoleBinding in
# rbac.yaml points at nothing and admission falls back to restricted-v2.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:scc:polymaker-gluetun
rules:
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    resourceNames: [polymaker-gluetun]
    verbs: [use]
