# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: polymaker-recorder
spec:
  endpoints:
    - port: metrics
      interval: 60s
  selector:
    matchLabels:
      app.kubernetes.io/component: polymaker-recorder-metrics
