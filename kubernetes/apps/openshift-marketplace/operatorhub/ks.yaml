# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: operatorhub
  namespace: flux-system
spec:
  path: ./kubernetes/apps/openshift-marketplace/operatorhub/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  timeout: 5m
  retryInterval: 1m
  # Cluster singleton owned by the marketplace operator: never let Flux
  # delete it.
  prune: false
  wait: false
