---
# No catalog sources. Nothing on this cluster is installed through OLM
# Subscriptions, yet the community-operators catalog (re-enabled by hand,
# never in git) kept restarting and re-unpacking its index image: ~20 MB/s
# of I/O on the NVMe shared with etcd and Ceph, for nothing. Re-enable a
# source here (disabled: false) if an operator from it is ever needed.
apiVersion: config.openshift.io/v1
kind: OperatorHub
metadata:
  name: cluster
spec:
  disableAllDefaultSources: true
  sources:
    - name: community-operators
      disabled: true
