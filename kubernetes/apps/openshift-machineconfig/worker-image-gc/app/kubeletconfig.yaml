# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/machineconfiguration.openshift.io/kubeletconfig_v1.json
---
apiVersion: machineconfiguration.openshift.io/v1
kind: KubeletConfig
metadata:
  name: worker-image-gc
spec:
  # Workers host all 3 ceph mons + OSDs. Mons store on the node root fs
  # (dataDirHostPath /var/lib/rook) and warn at <30% avail (70% used), but
  # kubelet's default image GC doesn't fire until 85% — so container-image
  # buildup silently tripped MON_DISK_LOW. Pull GC in ahead of the mon warn.
  machineConfigPoolSelector:
    matchLabels:
      pools.operator.machineconfiguration.openshift.io/worker: ""
  kubeletConfig:
    imageGCHighThresholdPercent: 70
    imageGCLowThresholdPercent: 60
