# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/machineconfiguration.openshift.io/kubeletconfig_v1.json
---
apiVersion: machineconfiguration.openshift.io/v1
kind: KubeletConfig
metadata:
  name: master-image-gc
spec:
  # Masters host ceph mons (dataDirHostPath /var/lib/rook) which warn at
  # <30% avail (70% used). Pull GC in ahead of the mon warn threshold.
  machineConfigPoolSelector:
    matchLabels:
      pools.operator.machineconfiguration.openshift.io/master: ""
  kubeletConfig:
    imageGCHighThresholdPercent: 70
    imageGCLowThresholdPercent: 60
