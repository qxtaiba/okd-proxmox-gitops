# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
---
# alerts for the api vip's silent failure modes. lives in kube-system so the
# thanos-ruler-enforced namespace label matches both the podmonitor-scraped
# kube-vip series and the platform kube-state-metrics lease series (which
# carry namespace="kube-system" from the lease object itself).
#
# note the job label: UWM stamps podmonitor-scraped series with
# job="<namespace>/<podmonitor-name>" (verified live: existing series are
# job="flux-system/flux-components", job="kube-system/reloader"), NOT the bare
# monitor name. so the up{} selectors below must use the slashed form or
# absent()/count() silently match the empty vector.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kube-vip-rules
  namespace: kube-system
spec:
  groups:
    - name: kube-vip.rules
      rules:
        - alert: KubeVipAllInstancesDown
          expr: |-
            absent(up{job="kube-system/kube-vip"} == 1)
          for: 5m
          annotations:
            summary: >-
              No kube-vip static pod is reporting metrics -- the API VIP 192.168.227.10 may be unmanaged
          labels:
            severity: critical
        - alert: KubeVipInstanceDown
          expr: |-
            count(up{job="kube-system/kube-vip"} == 1) < 3
          for: 15m
          annotations:
            summary: >-
              Only {{ $value }} of 3 kube-vip static pods are up
          labels:
            severity: warning
        - alert: KubeVipLeaseNotRenewed
          expr: |-
            time() - kube_lease_renew_time{namespace="kube-system", lease="plndr-cp-lock"} > 180
          for: 5m
          annotations:
            summary: >-
              plndr-cp-lock has not been renewed for over 3 minutes -- kube-vip leader election is dead (expired credential or API outage)
          labels:
            severity: critical
        - alert: KubeVipLeaseOwnerChanged
          expr: |-
            kube_lease_owner{namespace="kube-system", lease="plndr-cp-lock"}
              unless
            kube_lease_owner{namespace="kube-system", lease="plndr-cp-lock"} offset 15m
          annotations:
            summary: >-
              API VIP 192.168.227.10 failed over to {{ $labels.lease_holder }}
          labels:
            severity: info
        - alert: KubeVipKubeconfigCertExpiringSoon
          expr: |-
            (min(x509_cert_not_after{namespace="kube-system", filepath=~".*localhost.kubeconfig"}) - time()) < 30 * 86400
          for: 1h
          annotations:
            summary: >-
              The localhost.kubeconfig cert kube-vip authenticates with expires in under 30 days -- verify the cert-reload path unit fires when OKD rotates it
          labels:
            severity: warning
        - alert: KubeVipKubeconfigCertExpiryImminent
          expr: |-
            (min(x509_cert_not_after{namespace="kube-system", filepath=~".*localhost.kubeconfig"}) - time()) < 7 * 86400
          for: 1h
          annotations:
            summary: >-
              The localhost.kubeconfig cert kube-vip authenticates with expires in under 7 days -- leader election will die when it lapses
          labels:
            severity: critical
        # Asserts on the PAYLOAD, not on `up`. The previous expression watched
        # scrape liveness, and the exporter has been scraping green while
        # exporting zero certificate metrics since at least 2026-08-30:
        #
        #   level=WARN msg="read kubeconfig" path=/host/localhost.kubeconfig
        #     error="open /host/localhost.kubeconfig: permission denied"
        #   x509_source_up = 0 on all three pods
        #
        # The container runs as uid 0 so file permissions are satisfied;
        # SELinux is the blocker -- container_t has no read on
        # kubernetes_file_t. So the watchdog built to catch a blind cert alert
        # was itself blind to exactly that, and both KubeVipKubeconfigCert*
        # alerts above have never been able to fire.
        #
        # This will fire immediately and correctly until the exporter is
        # actually reading the kubeconfig again. That is the point: a broken
        # exporter should be loud, not green.
        - alert: KubeVipCertExporterAbsent
          expr: |-
            absent(x509_cert_not_after{job="kube-system/x509-certificate-exporter"})
          for: 30m
          annotations:
            summary: >-
              x509-certificate-exporter is scraping but exporting no certificate metrics -- kube-vip cert-expiry alerting is blind
          labels:
            severity: warning
        # Separate from the above so a partial failure is distinguishable from
        # a total one: the exporter reports per-source health independently of
        # whether any certificates were parsed.
        - alert: KubeVipCertExporterSourceFailing
          expr: |-
            x509_source_up == 0
          for: 30m
          annotations:
            summary: >-
              x509-certificate-exporter cannot read its source on {{ $labels.instance }}
          labels:
            severity: warning
