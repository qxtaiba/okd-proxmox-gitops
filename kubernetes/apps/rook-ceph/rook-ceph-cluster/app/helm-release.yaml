# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  # The cluster chart waits on operator-reconciled CRs (CephCluster phase,
  # OSD health). With wait:true Helm times out before the operator settles
  # and loops through rollbacks. Disable wait and gate dependents via
  # Kustomization-level health checks instead.
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    remediation:
      retries: 3
  values:
    operatorNamespace: rook-ceph
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    # NOTE: This cluster requires >=3 Ceph-eligible nodes.
    # All pools use failureDomain: host with replicated.size: 3, which is
    # mathematically unsatisfiable with <3 hosts (pools sit DEGRADED, I/O blocks).
    # If shrinking the cluster below 3 hosts, adjust replicated.size and
    # failureDomain in every pool (cephBlockPools, cephFileSystems, cephObjectStores).
    # Pinned to the last GA release. Renovate offered v21.1.0 and it was
    # merged on 2026-09-24; rook refused it outright:
    #
    #   failed the ceph version check: allowUnsupported must be set to true
    #   to run with this version "21.1.0-0 umbrella"
    #
    # "umbrella" is a pre-release build, not a stable GA - renovate matched it
    # on version-string shape alone. The daemons never left v20.2.4 and the
    # data was never at risk (HEALTH_OK, 30/30 PVCs bound, verified by writing
    # through a live Ceph volume), but the cluster sat in Progressing with the
    # object and file controllers refusing to reconcile, and the toolbox broke
    # because rook had already moved IT to the v21 image against a v20 cluster.
    #
    # Do not take a Ceph major here without a planned rollout: pre-flight
    # checks, a fresh etcd backup, and a watched roll, the same way the OKD
    # 4.22 upgrade was done.
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v20.2.4
    cephClusterSpec:
      # CVE-2025-30156: Ceph 20.2.4 flags the legacy AES-128 cephx keys every
      # daemon was created with (AUTH_INSECURE_*, two at ERR level). Rook
      # v1.20.6+ rotates daemon keys declaratively — bump keyGeneration to
      # rotate again. Rook auto-selects aes256k for daemons on 20.2.4.
      # Keys created at cluster birth already carry generation 1 and Rook
      # rotates only when the declared generation EXCEEDS the current one,
      # so the first real rotation is generation 2.
      # CSI (kernel-mount) keys are deliberately NOT rotated to aes256k: the
      # cephfs/rbd kernel clients need Linux >= 7.0 for it and SCOS ships
      # older, so AUTH_INSECURE_CLIENT_KEY_TYPE is expected to keep warning
      # for the csi users — mute that one check rather than "fix" it.
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      cephConfig:
        global:
          bdev_enable_discard: "true"
          bdev_async_discard_threads: "1"
          osd_class_update_on_start: "false"
          device_failure_prediction_mode: local
          # Daemons already log to stderr, which CRI-O and Loki keep. File
          # logging wrote every line a second time to the same NVMe that
          # backs etcd. Paired with logCollector.enabled: false below.
          log_to_file: "false"
        osd:
          # The OSDs sit on QEMU virtual disks that report rotational=1, so
          # BlueStore applies its HDD defaults: every write <= 64K is first
          # journalled into RocksDB and later rewritten in place, i.e.
          # written twice. The real device is an NVMe, where the SSD
          # default (0, no deferral) is correct. This is the setting that
          # matters; the device class itself stays `hdd` (pinned by
          # osd_class_update_on_start above) so CRUSH rules are unaffected.
          bluestore_prefer_deferred_size_hdd: "0"
          # mClock budgets each OSD by its measured IOPS capacity. The
          # startup benchmark runs against a virtual disk on a shared NVMe,
          # so it measured anything from 251 to 363 depending on what else
          # was writing, and left per-OSD overrides behind (including one
          # for a long-gone osd.1). One deliberate value for every OSD
          # instead. It is the hdd default, and it doubles as a ceiling that
          # keeps Ceph from saturating the drive etcd fsyncs to -- revisit
          # once etcd has its own disk.
          osd_mclock_skip_benchmark: "true"
          osd_mclock_max_capacity_iops_hdd: "315"
          # Scrubs read every object; confine them to the night (22:00-05:00
          # wraps midnight) so they don't compete with daytime I/O.
          osd_scrub_begin_hour: "22"
          osd_scrub_end_hour: "5"
      crashCollector:
        disable: false
      # The log collector exists to rotate on-disk daemon logs, which are
      # off (log_to_file above).
      logCollector:
        enabled: false
      csi:
        readAffinity:
          enabled: true
          crushLocationLabels:
            - kubernetes.io/hostname
      dashboard:
        enabled: true
        ssl: true
      mgr:
        modules:
          # diskprediction_local disabled: virtual disks (QEMU virtio-scsi)
          # don't report real SMART data, causing nightly MgrDBNotReady
          # crashes in the devicehealth module (ceph-tracker#64621).
          - name: diskprediction_local
            enabled: false
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      placement:
        all:
          tolerations:
            - key: storage-node
              operator: Exists
      # Requests sized from 7 days of measured working set rather than from
      # chart defaults. Cluster memory requests had reached 61GiB against a
      # 56.5GiB single-node-failure budget, which is what KubeMemoryOvercommit
      # was reporting -- and almost all of the slack was here, not in the
      # workloads that actually use memory. Limits are left generous; the
      # request is a scheduling promise, the limit is the safety net.
      resources:
        mon:
          # measured ~490Mi per mon
          requests:
            cpu: 100m
            memory: 768Mi
          limits:
            memory: 2Gi
        mgr:
          # measured ~255Mi per mgr
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            memory: 1Gi
        # The log-collector sidecar rides on every ceph daemon pod and was
        # requesting ~1.46GiB in aggregate to use 0.02GiB. Biggest single
        # source of phantom reservation in the cluster.
        logcollector:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        osd:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 4Gi
      storage:
        useAllNodes: true
        useAllDevices: false
        # Match the second Terraform-provisioned disk (scsi1 = CEPH-DATA).
        # Using devicePathFilter because virtio-scsi-single enumeration of
        # /dev/sdX is non-deterministic across reboots, but the SCSI bus
        # assignment (drive-scsi1) is stable per Terraform disk block order.
        devicePathFilter: "^/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1$"
        config:
          osdsPerDevice: "1"
    cephBlockPools:
      - name: okd-rbd
        spec:
          failureDomain: host
          # 2, not 3 (2026-10-10): every OSD sits on the same single host
          # NVMe, so a third copy protects against losing one VM's disk image,
          # not the drive, while costing a third more physical writes on the
          # device etcd shares. VolSync restic copies on the NAS are the real
          # backup.
          replicated:
            size: 2
            requireSafeReplicaSize: true
          # Shrinking 3 -> 2 left min_size at 2, so stopping any OSD (every
          # node reboot or OSD roll) made a third of the PGs inactive and froze
          # all block I/O, and `ceph osd ok-to-stop` was false for every OSD.
          # min_size 1 keeps PGs writable on the surviving copy.
          parameters:
            min_size: "1"
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          # Delete, not Retain: volsync restic to the NAS is the tested undo
          # button; Retain-by-default with no reaper piled up ~493 Released
          # PVs pinning dead RBD images. reclaimPolicy is immutable on a live
          # StorageClass -- after merging, run `oc delete sc ceph-block` once
          # and let the helm remediation recreate it (existing PVs and PVCs
          # are untouched; the policy lives on each PV, not the class).
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - discard
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems:
      - name: okd-cephfs
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
              requireSafeReplicaSize: true
          dataPools:
            - failureDomain: host
              replicated:
                size: 3
                requireSafeReplicaSize: true
              name: data0
          preserveFilesystemOnDelete: true
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: okd-cephfs
            # measured ~45Mi per mds across the active/standby pair; 1Gi was
            # reserving 22x the working set.
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 4Gi
        storageClass:
          enabled: true
          name: ceph-filesystem
          pool: data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete
    cephObjectStores:
      - name: okd-ceph-objectstore
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
              requireSafeReplicaSize: true
          dataPool:
            failureDomain: host
            replicated:
              size: 3
              requireSafeReplicaSize: true
          preservePoolsOnDelete: true
          gateway:
            port: 80
            instances: 2
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
        storageClass:
          enabled: true
          name: ceph-bucket
          reclaimPolicy: Delete
