# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps/daemonset_v1.json
---
# watches localhost.kubeconfig, the node credential OKD rotates via
# node-system-admin-signer, and turns its expiry into a metric
# (x509_cert_not_after) that api-vip-rules alerts on.
#
# Originally added because the kube-vip static pod authenticated with this file
# and never hot-reloaded it, making expiry a silent leader-election killer.
# keepalived replaced kube-vip and needs no kubeconfig at all, so that specific
# failure mode is gone -- but the certificate is still a real cluster
# credential worth watching, so this stays.
#
# Reads the credential from a Secret synced by external-secrets rather than the
# host path: the container runs as uid 0 so DAC passes, but SELinux forbids
# container_t from reading kubernetes_file_t, which left this exporter scraping
# green while exporting nothing for months. Runs on masters only.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: x509-certificate-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: x509-certificate-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: x509-certificate-exporter
    spec:
      serviceAccountName: x509-certificate-exporter
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - operator: "Exists"
          effect: "NoExecute"
        - operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: x509-certificate-exporter
          image: docker.io/enix/x509-certificate-exporter:4.2.0
          args:
            - --watch-kubeconf=/etc/kubeconfig/localhost.kubeconfig
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 50m
              memory: 64Mi
          ports:
            - containerPort: 9793
              name: metrics
          # No runAsUser: 0 and no SCC exception any more. The kubeconfig now
          # arrives as a projected Secret volume owned by the container, so
          # neither root nor an SELinux exemption is needed to read it.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kubeconfig
              readOnly: true
      volumes:
        - name: kubeconfig
          secret:
            secretName: x509-node-kubeconfig
  updateStrategy:
    type: RollingUpdate
