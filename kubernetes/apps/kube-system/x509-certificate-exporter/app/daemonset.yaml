# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps/daemonset_v1.json
---
# watches the on-disk localhost.kubeconfig that the kube-vip static pod
# authenticates with. kube-vip loads that credential once at startup and never
# hot-reloads it, so cert expiry there is a silent leader-election killer --
# this exporter turns it into a metric (x509_cert_not_after) that the kube-vip
# prometheusrule alerts on. runs on masters only; the platform node-exporter
# cannot do this because its textfile dir is an emptyDir, not a hostPath.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: x509-certificate-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: x509-certificate-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: x509-certificate-exporter
    spec:
      serviceAccountName: x509-certificate-exporter
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - operator: "Exists"
          effect: "NoExecute"
        - operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: x509-certificate-exporter
          image: docker.io/enix/x509-certificate-exporter:4.2.0
          args:
            - --watch-kubeconf=/host/localhost.kubeconfig
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 50m
              memory: 64Mi
          ports:
            - containerPort: 9793
              name: metrics
          securityContext:
            # the watched kubeconfig is root-owned 0600 on the host, so read it
            # as uid 0 -- but nothing more. no privileged, no added caps; the
            # hostmount-anyuid SCC (see rbac.yaml) grants exactly hostPath +
            # RunAsAny.
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kubeconfig
              mountPath: /host/localhost.kubeconfig
              readOnly: true
      volumes:
        - name: kubeconfig
          hostPath:
            path: /etc/kubernetes/static-pod-resources/kube-apiserver-certs/secrets/node-kubeconfigs/localhost.kubeconfig
            type: File
  updateStrategy:
    type: RollingUpdate
