# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/serviceaccount.json
---
# No SCC binding. The exporter used to need hostmount-anyuid to hostPath-mount
# a root-owned 0600 file and run as uid 0 to read it -- and it still could not,
# because SELinux denies container_t any read of kubernetes_file_t. The
# kubeconfig now arrives through a projected Secret volume instead, so the
# default restricted SCC is sufficient.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: x509-certificate-exporter
