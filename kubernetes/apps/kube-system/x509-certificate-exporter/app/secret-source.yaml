# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/clustersecretstore_v1.json
---
# Pulls the ACME-signed kubeconfig kube-vip authenticates with out of the API
# rather than off the host filesystem.
#
# The exporter previously read /host/localhost.kubeconfig through a hostPath as
# uid 0 under the hostmount-anyuid SCC. That never worked: the container runs
# as root so file permissions were satisfied, but SELinux denies container_t
# any read of kubernetes_file_t, so x509_source_up was 0 on all three pods for
# 14+ days and both kube-vip cert-expiry alerts were structurally unable to
# fire.
#
# The exporter's own --watch-kube-secrets mode cannot replace it: certificates
# inside a kubeconfig are base64-encoded under client-certificate-data, and the
# secret watcher only parses pem/pkcs12/der/jks. Verified - the decoded
# kubeconfig contains zero `BEGIN CERTIFICATE` headers. Only the file-based
# --watch-kubeconf parser understands the format.
#
# So: deliver the same file through a projected Secret volume instead of a
# hostPath. No SELinux involvement, no uid 0, no SCC exception, and the store
# below is scoped by remoteNamespace to a single namespace.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kube-apiserver-kubeconfigs
spec:
  provider:
    kubernetes:
      remoteNamespace: openshift-kube-apiserver
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: kube-system
          key: ca.crt
      auth:
        serviceAccount:
          name: x509-kubeconfig-reader
          namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: x509-kubeconfig-reader
---
# Cluster-scoped because this Kustomization sets targetNamespace: kube-system,
# which would rewrite a namespaced Role away from openshift-kube-apiserver.
# ClusterRole/ClusterRoleBinding are unaffected by that rewrite.
#
# Scope comes from resourceNames instead: this grants read on Secrets named
# exactly `node-kubeconfigs`, of which the cluster has one. Compare the
# upstream chart, which ships a ClusterRole granting secrets get/watch/list
# across every namespace with no name restriction.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: x509-kubeconfig-reader
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [node-kubeconfigs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: x509-kubeconfig-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: x509-kubeconfig-reader
subjects:
  - kind: ServiceAccount
    name: x509-kubeconfig-reader
    namespace: kube-system
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: x509-node-kubeconfig
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: kube-apiserver-kubeconfigs
  target:
    name: x509-node-kubeconfig
  data:
    - secretKey: localhost.kubeconfig
      remoteRef:
        key: node-kubeconfigs
        property: localhost.kubeconfig
