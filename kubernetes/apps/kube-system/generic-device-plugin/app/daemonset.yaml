# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps/daemonset_v1.json
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: generic-device-plugin
      tolerations:
        - operator: "Exists"
          effect: "NoExecute"
        - operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: generic-device-plugin
          # Upstream publishes no semver tags (only commit SHAs + latest), so
          # this tracks latest pinned by digest — Renovate's kubernetes
          # manager rolls the digest, which a bare SHA tag can't get.
          image: ghcr.io/squat/generic-device-plugin:latest@sha256:dc192e164c69b03f156765793a1be62ca437709ae477b27ca7d8f3dcf5021576
          args:
            - --device
            - |
              name: tun
              groups:
                - count: 10
                  paths:
                    - path: /dev/net/tun
          resources:
            requests:
              cpu: 50m
              memory: 10Mi
            limits:
              cpu: 50m
              memory: 20Mi
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
  updateStrategy:
    type: RollingUpdate
