# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
---
# notification-controller reads the Discord webhook from a Secret key named
# exactly `address` -- that name is fixed by the Provider API, which is why the
# 1Password field is remapped here rather than matching one-for-one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-flux-webhook
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: discord-flux-webhook
  data:
    - secretKey: address
      remoteRef:
        key: alertmanager-discord
        property: webhook-url-flux
