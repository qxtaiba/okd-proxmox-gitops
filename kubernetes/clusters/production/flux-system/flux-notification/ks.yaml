# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-notification
  namespace: flux-system
spec:
  # Separate from flux-instance because this needs external-secrets, which is
  # far downstream of the bootstrap layer. Folding it into flux-instance would
  # make the controllers' own Kustomization depend on a controller they deploy.
  dependsOn:
    - name: external-secrets
      namespace: flux-system
  targetNamespace: flux-system
  path: ./kubernetes/clusters/production/flux-system/flux-notification/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  interval: 10m
  timeout: 5m
  retryInterval: 1m
  prune: true
  wait: true
