# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: metallb
  install:
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: 3
  values:
    priorityClassName: infrastructure-critical
    prometheus:
      serviceAccount: prometheus-k8s
      namespace: openshift-monitoring
      serviceMonitor:
        # The chart hardcodes `bearerTokenFile:` on every ServiceMonitor
        # endpoint (templates/servicemonitor.yaml) with no value to turn it
        # off. User-workload Prometheus rejects that outright -- "accesses
        # file system via bearer token file which Prometheus specification
        # prohibits" -- so both monitors were permanently rejected, firing
        # PrometheusOperatorRejectedResources and emitting InvalidConfiguration
        # events every scrape interval while scraping nothing. Restoring
        # metallb metrics means hand-writing ServiceMonitors that use
        # `authorization.credentials` against a metallb-system SA token.
        enabled: false
      speakerMetricsTLSSecret: ""
      controllerMetricsTLSSecret: ""
    speaker:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
    controller:
      replicaCount: 2
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
    # Chart 0.16.1 defaults frrk8s.enabled=true, which lands a 3-replica
    # DaemonSet whose SA (metallb-frr-k8s-controller) has no SCC binding here,
    # so it has sat at 0/3 created since the 0.16.1 bump, retrying forever.
    # This cluster is L2-only (one L2Advertisement, zero BGPPeers), so FRR is
    # not needed at all -- switch it off rather than grant it privileged SCC.
    frrk8s:
      enabled: false
