# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: volsync
  # retries: -1 means retry indefinitely. Volsync's restic cache PVCs bind
  # to ceph-block which is provisioned by rook-ceph-cluster from a sibling
  # Kustomization tree - Flux retries until the storage class exists
  # instead of failing.
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
  values:
    metrics:
      # The chart fronts /metrics with kube-rbac-proxy on :8443, but its own
      # ServiceMonitor ships no credentials, so the scrape returned 401 and
      # volsync_* never reached Prometheus -- every VolSync alerting rule was
      # unfirable and the nightly backups were effectively unmonitored.
      # These are backup timing/duration gauges on a ClusterIP service with no
      # route, so dropping the auth check is the proportionate fix.
      disableAuth: true

