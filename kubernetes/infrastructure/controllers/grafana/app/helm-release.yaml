# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: grafana-operator
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    isOpenShift: true
    # Ran BestEffort; measured ~81Mi. It owns every dashboard and datasource,
    # so losing it to an eviction silently stops dashboard reconciliation.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi
    dashboard:
      enabled: true
    serviceMonitor:
      enabled: true
