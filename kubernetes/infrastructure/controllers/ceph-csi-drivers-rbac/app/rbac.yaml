# ceph-csi driver plugin RBAC. The ceph-csi-operator generates the CSI
# DaemonSets/Deployments but cannot create these ServiceAccounts/roles itself
# (no RBAC-management permissions, by design). Upstream ships them in the
# ceph-csi-drivers Helm chart; that release was reverted here, orphaning the
# Driver CRs and pruning this RBAC — which took storage down cluster-wide until
# it was restored by hand. Declared here so Flux owns and self-heals it (a
# HelmRelease would not: driftDetection is off). Bare SA names match the live
# Driver CRs; do not rename without also rolling the drivers, or 470+ PVs lose
# their provisioner.
---
