# ceph-csi Driver CRs. The ceph-csi-operator reconciles these into the CSI
# DaemonSets/Deployments. They were left orphaned when the ceph-csi-drivers
# Helm release was reverted (release deleted, CRs survived). Adopted here as-is
# so Flux owns them alongside the RBAC and OperatorConfig — one gitops source
# for the whole driver stack, self-healing on prune/drift.
#
# The name IS the CSIDriver every PV binds to (470+ rbd, 2 cephfs). Exported
# byte-for-byte from the live cluster and proven zero-diff, so adoption changes
# only ownership labels — no operator reconcile, no CSI roll. Do NOT rename or
# alter spec here without a maintenance window: a CSIDriver-identity change
# orphans every bound volume.
---
# Memory requests below are sized from measured working set, not from the
# ceph-csi defaults. The plugins were requesting 512Mi each against 43Mi
# (cephfs) and 104Mi (rbd) of actual use -- 5-12x over -- which was the single
# largest block of phantom reservation in the cluster and the reason
# KubeMemoryOvercommit could not be cleared any other way. The Proxmox host is
# already allocating 94GiB to VMs on 92GiB of physical RAM, so growing the
# nodes was never an option; the memory had to come from somewhere real.
#
# Limits are unchanged. Only the scheduling promise moved.
#
# Second pass (2026-10-05), controller plugins only, from peak working set:
# sidecars 128->96Mi (peak 76-83Mi), rbd plugin 256->128Mi (peak 103Mi),
# cephfs plugin 256->64Mi (peak 40Mi). Reserving 2Gi per node for
# system.slice had pushed requests (55.1GiB) past what two nodes can hold
# (54.5GiB). Node plugins are deliberately untouched: changing them rolls
# the per-node CSI DaemonSets.
#
# The sidecar request fields also carry a "rook" field manager, from a
# one-off Update on 2026-06-03 (Rook v1.20 has no CSI resource values left
# in its chart, and does not reconcile these). Flux applies with force, so
# it simply takes ownership; if a future Rook upgrade rewrites its
# defaults, the next Flux interval puts these back.
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: rook-ceph.rbd.csi.ceph.com
  namespace: rook-ceph
spec:
  cephFsClientType: kernel
  clusterName: rook-ceph
  controllerPlugin:
    affinity:
      nodeAffinity: {}
    imagePullPolicy: ''
    priorityClassName: system-cluster-critical
    replicas: 2
    resources:
      attacher:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 96Mi
      omapGenerator:
        limits:
          memory: 1Gi
        requests:
          cpu: 250m
          memory: 256Mi
      plugin:
        limits:
          memory: 1Gi
        requests:
          memory: 128Mi
      provisioner:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 96Mi
      resizer:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 96Mi
      snapshotter:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 96Mi
  deployCsiAddons: false
  enableMetadata: false
  fsGroupPolicy: File
  generateOMapInfo: false
  imageSet:
    name: rook-csi-operator-image-set-configmap
  log: {}
  nodePlugin:
    affinity:
      nodeAffinity: {}
    enableSeLinuxHostMount: false
    imagePullPolicy: ''
    kubeletDirPath: /var/lib/kubelet
    priorityClassName: system-node-critical
    resources:
      plugin:
        limits:
          memory: 1Gi
        requests:
          cpu: 250m
          memory: 256Mi
      registrar:
        limits:
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi
    updateStrategy:
      type: RollingUpdate
---
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: rook-ceph.cephfs.csi.ceph.com
  namespace: rook-ceph
spec:
  cephFsClientType: kernel
  clusterName: rook-ceph
  controllerPlugin:
    affinity:
      nodeAffinity: {}
    imagePullPolicy: ''
    priorityClassName: system-cluster-critical
    replicas: 2
    resources:
      attacher:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 96Mi
      plugin:
        limits:
          memory: 1Gi
        requests:
          cpu: 250m
          memory: 64Mi
      provisioner:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 96Mi
      resizer:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 96Mi
      snapshotter:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 96Mi
  deployCsiAddons: false
  enableMetadata: false
  fsGroupPolicy: File
  generateOMapInfo: false
  imageSet:
    name: rook-csi-operator-image-set-configmap
  log: {}
  nodePlugin:
    affinity:
      nodeAffinity: {}
    enableSeLinuxHostMount: false
    imagePullPolicy: ''
    kubeletDirPath: /var/lib/kubelet
    priorityClassName: system-node-critical
    resources:
      plugin:
        limits:
          memory: 1Gi
        requests:
          cpu: 250m
          memory: 256Mi
      registrar:
        limits:
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi
    updateStrategy:
      type: RollingUpdate
