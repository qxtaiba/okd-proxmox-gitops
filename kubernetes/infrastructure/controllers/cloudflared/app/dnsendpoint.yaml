# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/externaldns.k8s.io/dnsendpoint_v1alpha1.json
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: cloudflared-tunnel
  annotations:
    # external-dns runs with --annotation-filter=external-dns.alpha.kubernetes.io/target,
    # and that filter applies to EVERY source including this CRD one. Without
    # the annotation present this DNSEndpoint is silently skipped -- external-dns
    # logs "All records are already up to date" and never reconciles it, which
    # is why external.grappleberry.xyz has no TXT ownership record and why
    # router-grappleberry.grappleberry.xyz was never created.
    #
    # The value is set to the tunnel rather than something arbitrary on
    # purpose. The CRD source should take targets from spec.endpoints and
    # ignore this, but if external-dns ever honours the annotation as an
    # override here, both endpoints already point where they should -- rather
    # than being rewritten to a bogus hostname, which would take
    # external.grappleberry.xyz down and with it plex.
    external-dns.alpha.kubernetes.io/target: 6e5ac84c-22c7-4a51-891e-1a5133ab9e54.cfargotunnel.com
spec:
  endpoints:
    - dnsName: external.grappleberry.xyz
      recordTTL: 1
      recordType: CNAME
      targets:
        - 6e5ac84c-22c7-4a51-891e-1a5133ab9e54.cfargotunnel.com
    # external-dns publishes OpenShift Routes as a CNAME to the Route's
    # status.ingress[].routerCanonicalHostname -- router-grappleberry.grappleberry.xyz
    # -- and ignores the external-dns.alpha.kubernetes.io/target annotation
    # when doing so. That hostname had no record in the zone, so every
    # externally-published Route was a dangling CNAME and Cloudflare answered
    # HTTP 530 / error 1016 (origin DNS error). overseerr and requests were
    # both affected; plex was not, because its record predates external-dns
    # taking ownership and still points at external.grappleberry.xyz.
    #
    # Pointing the canonical router hostname at the tunnel fixes every Route
    # external-dns manages, present and future, with one record -- rather than
    # fighting external-dns over each annotation.
    - dnsName: router-grappleberry.grappleberry.xyz
      recordTTL: 1
      recordType: CNAME
      targets:
        - 6e5ac84c-22c7-4a51-891e-1a5133ab9e54.cfargotunnel.com
