# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
---
# NOTE: PushSecret is still v1alpha1 in external-secrets 0.14/chart 2.2.
# No v1beta1 exists yet despite External Secrets v1 being GA for
# ExternalSecret resources. Revisit when upstream ships v1beta1.
#
# tls.crt and tls.key go to SEPARATE 1Password items on purpose.
# external-secrets issues one GET + one PUT per property, so pointing both at
# a single remoteKey meant two writes racing the same item: the first landed
# (bumping the item version) and the second was rejected with HTTP 400, which
# left this PushSecret permanently Errored and churned ~20 item versions an
# hour. The backup itself was never wrong -- 1Password Connect's PUT replaces
# the whole item, so the first write already carried both fields -- but a
# resource stuck in Errored hides the next real failure. One property per
# item means one write per item and nothing to lose a race with.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grappleberry-xyz-tls
spec:
  # The cert changes ~every 60d (90d lifetime, renewBefore 30d); this interval
  # only controls how soon a renewal is mirrored, and every refresh is an
  # unconditional re-push, so keep it slow.
  refreshInterval: 12h
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: grappleberry-xyz-tls
  template:
    data:
      tls.crt: '{{ index . "tls.crt" | b64enc }}'
      tls.key: '{{ index . "tls.key" | b64enc }}'
  data:
    - match:
        secretKey: &crt tls.crt
        remoteRef:
          remoteKey: grappleberry-xyz-tls-crt
          property: *crt
    - match:
        secretKey: &key tls.key
        remoteRef:
          remoteKey: grappleberry-xyz-tls-key
          property: *key
